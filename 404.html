<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 젤라켈리</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  html,body{height:100%}
  body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;color:#121319;
       background:#fff;text-align:center;padding:24px;word-break:keep-all}
  .mark{font-weight:900;font-size:22px;letter-spacing:-.01em;margin-bottom:40px}
  h1{margin:0 0 14px;font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.25}
  p{margin:0 0 34px;font-size:17px;line-height:1.75;color:#5A5F80;max-width:34ch}
  a.btn{border:1.5px solid #121319;padding:13px 30px;border-radius:100px;font-size:15px;
        font-weight:700;color:#121319;text-decoration:none}
  a.btn:hover{background:#121319;color:#fff}
</style>
</head>
<body>
  <div class="mark">JELAKELLY</div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>홈에서 다시 찾아 주세요.</p>
  <a class="btn" href="/">홈으로 돌아가기</a>
</body>
</html>
